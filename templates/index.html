<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Domain 本地万能素材提取工具</title>
<style>
  :root {
    --text: #17181a; --muted: #6f7379;
    --dark: #3a3e45; --dark-hover: #4a4f57;
    --line: rgba(0, 0, 0, 0.1);
    --glass: #ffffff;
    --glass-strong: #ffffff;
    --glass-border: #e3e5e9;
    --glass-shadow: 0 1px 2px rgba(0, 0, 0, .04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); min-height: 100vh;
    background: #f5f6f8;
    overflow-x: hidden;
  }
  /* flat 2D theme: decorative blobs are disabled */
  .blob { display: none; }

  .corner-fabs {
    position: fixed; top: 18px; right: 22px; z-index: 55;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
  }
  /* 左上角小提示：使用前先看右上角使用说明（点击直达） */
  .corner-hint {
    position: fixed; top: 14px; left: 22px; z-index: 55;
    font-size: 12px; color: #9aa0a8; cursor: pointer;
    background: none; border: none; padding: 2px 6px; font-family: inherit;
    transition: color .2s;
  }
  .corner-hint:hover { color: #55595f; text-decoration: underline; }
  @media (max-width: 640px) { .corner-hint { display: none; } }
  .menu-btn {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #d9dce1; color: var(--text);
    cursor: pointer; box-shadow: var(--glass-shadow);
    transition: all .2s;
  }
  .menu-btn:hover, .menu-btn.open { background: #f2f3f5; transform: translateY(-1px); }

  .menu-pop {
    position: absolute; top: 48px; right: 0; width: 320px; max-width: calc(100vw - 28px);
    background: #fff; border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 8px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .12);
    animation: pop .18s ease;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: none; font-family: inherit; text-align: left;
    color: var(--text); font-size: 13.5px; font-weight: 600;
    padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background .15s;
  }
  .menu-item:hover { background: rgba(0, 0, 0, .06); }
  .menu-item:active { background: rgba(0, 0, 0, .11); }
  .menu-item svg { flex: none; opacity: .72; }
  /* 带边框的菜单项（选择新地址）：底色走 CSS 类，hover 才能覆盖 */
  .menu-item.boxed {
    background: #fff;
    border: 1px solid #d9dce1;
  }
  .menu-item.boxed:hover { background: rgba(0, 0, 0, .06); }
  .menu-item.boxed:active { background: rgba(0, 0, 0, .11); }
  .menu-sep { height: 1px; background: rgba(0, 0, 0, .08); margin: 6px 8px; }
  .menu-dldir { padding: 6px 10px 8px; }
  .menu-dldir-label { font-size: 11.5px; font-weight: 700; color: var(--muted);
    letter-spacing: .4px; margin: 2px 0 3px; }
  .menu-dldir-cur { font-size: 12px; color: var(--text); opacity: .78;
    word-break: break-all; margin-bottom: 4px; line-height: 1.45; }
  .menu-dldir-hint { font-size: 11px; color: var(--muted); opacity: .9;
    margin-bottom: 8px; line-height: 1.4; }
  .menu-dldir-row { display: flex; gap: 6px; }
  .menu-dldir-row input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 12.5px;
    border: 1px solid #d9dce1; border-radius: 8px; padding: 7px 9px;
    background: #fff; color: var(--text); outline: none;
  }
  .menu-dldir-row input:focus { border-color: rgba(0, 0, 0, .35); }
  .menu-dldir-row .btn { flex: none; padding: 7px 13px; font-size: 12.5px; }
  .menu-dldir-msg { font-size: 12px; margin-top: 7px; line-height: 1.5; display: none; }
  .menu-dldir-msg.ok { display: block; color: #1e7e34; }
  .menu-dldir-msg.bad { display: block; color: #c0392b; word-break: break-all; }

  .mask {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 24px 16px;
    background: rgba(23, 24, 26, .32);
  }
  .mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 700px; max-height: 84vh; overflow-y: auto;
    background: #fff; border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 24px 28px 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .14);
    animation: pop .22s ease;
    scrollbar-width: thin; scrollbar-color: #c6c9ce transparent;
  }
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: #c6c9ce; border-radius: 3px; background-clip: padding-box; }
  .modal::-webkit-scrollbar-thumb:hover { background: #a9adb3; }
  .modal::-webkit-scrollbar-button,
  .modal::-webkit-scrollbar-button:vertical:start,
  .modal::-webkit-scrollbar-button:vertical:end,
  .modal::-webkit-scrollbar-button:vertical:start:decrement,
  .modal::-webkit-scrollbar-button:vertical:end:increment,
  .modal::-webkit-scrollbar-button:single-button:vertical:start:decrement,
  .modal::-webkit-scrollbar-button:single-button:vertical:end:increment {
    display: none; width: 0; height: 0;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .modal-close {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .modal-close:hover { background: #f2f3f5; color: var(--text); }
  .help-sec { margin-bottom: 20px; }
  .help-sec h4 {
    font-size: 13px; font-weight: 700; letter-spacing: .4px; color: var(--text);
    margin-bottom: 9px; padding-left: 9px; border-left: 3px solid var(--dark);
  }
  .help-sec p { font-size: 13px; line-height: 1.85; color: #43464b; }
  .help-sec ul { list-style: none; }
  .help-sec li { position: relative; padding-left: 14px; font-size: 13px; line-height: 1.85; color: #43464b; }
  .help-sec li::before {
    content: ""; position: absolute; left: 2px; top: 11px;
    width: 4px; height: 4px; border-radius: 50%; background: #9ca0a6;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0 10px; }
  .tag {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: #f2f3f5; border: 1px solid var(--line); color: #3c3f44;
  }
  .tag.off { color: #a0a3a8; text-decoration: line-through; background: #f7f8f9; }
  .help-note {
    font-size: 12.5px; color: var(--muted); line-height: 1.85; padding: 12px 14px;
    border-radius: 14px; background: rgba(0, 0, 0, .035); border: 1px solid var(--line);
  }
  .modal-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted);
  }

  .wrap { max-width: 1220px; margin: 0 auto; padding: 40px 20px 60px; }
  .cols { display: flex; gap: 24px; align-items: flex-start; }
  .col-main { flex: 1 1 auto; min-width: 0; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 30px; letter-spacing: .5px; color: var(--text); font-weight: 700; }
  header p { color: var(--muted); margin-top: 8px; font-size: 14px; }

  /* connection banner: only visible when the page lost the local server */
  .conn-bar {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    max-width: 720px; margin: -10px auto 20px; padding: 10px 16px;
    border-radius: 14px; font-size: 13px; line-height: 1.5;
    background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .35);
    color: var(--text);
  }
  .conn-bar[hidden] { display: none; }
  .conn-bar .btn { padding: 4px 12px; font-size: 12px; }
  /* WeChat Channels: one-time Yuanbao cookie panel */
  .sph-panel {
    margin-top: 14px; padding: 14px 16px; border-radius: 14px;
    background: rgba(7, 193, 96, .08); border: 1px solid rgba(7, 193, 96, .28);
  }
  .sph-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .sph-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
  .sph-panel textarea {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 62px;
    padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    background: var(--input-bg, rgba(0,0,0,.03)); color: var(--text);
    border: 1px solid var(--glass-border); font-family: inherit;
  }
  .sph-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  /* panel buttons are compact and uniform (incl. the primary "save & retry") */
  .sph-actions .btn { padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
  /* selected browser: dark ring + check mark, so you can see which one worked */
  .sph-actions .btn[data-browser].on {
    background: rgba(0, 0, 0, .06);
    border-color: var(--dark);
    box-shadow: inset 0 0 0 1px var(--dark);
  }
  .sph-actions .btn[data-browser].on::after { content: "✓"; margin-left: 6px; font-size: 11px; }
  .sph-actions .btn[data-browser].busy { opacity: .55; }
  .sph-msg { font-size: 12px; color: var(--muted); }
  .sph-msg.bad { color: #ef4444; }
  .sph-msg.ok { color: #10b981; }
  /* paste-cookie modal */
  .paste-desc { font-size: 13px; line-height: 1.8; color: #43464b; margin-bottom: 10px; }
  #pasteCookieInput {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 96px;
    padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    background: var(--input-bg, rgba(0,0,0,.03)); color: var(--text);
    border: 1px solid var(--glass-border); font-family: inherit;
  }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
  }
  .search-card { padding: 22px; }

  .input-row { display: flex; gap: 12px; }
  .input-row input {
    flex: 1; padding: 10px 16px; font-size: 14.5px; color: var(--text);
    background: #fff;
    border: 1px solid #d9dce1; border-radius: 10px; outline: none;
    transition: all .2s;
  }
  .input-row input::placeholder { color: #9a9ea6; }
  .input-row input:focus { border-color: rgba(0, 0, 0, .45); background: #fff; }
  /* compact row buttons (Clear / Analyze) so they don't tower over the input */
  .input-row .btn { padding: 10px 20px; font-size: 14px; }

  .btn {
    border: 1px solid transparent; border-radius: 12px; cursor: pointer;
    font-size: 15px; padding: 13px 26px; font-weight: 600; color: #fff; white-space: nowrap;
    background: var(--dark);
    transition: all .2s;
  }
  .btn:hover { background: var(--dark-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.secondary {
    background: #fff; color: var(--text);
    border: 1px solid #d4d7dc;
  }
  .btn.secondary:hover { background: #f2f3f5; }
  .btn.ghost {
    background: #fff; color: var(--text);
    border: 1px solid #d4d7dc; box-shadow: none;
  }
  .btn.ghost:hover { background: #f2f3f5; }

  .hint { margin-top: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .proxy-row { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .proxy-row .grow { flex: 1 1 220px; min-width: 180px; }
  .row-sep { width: 1px; height: 22px; background: rgba(0,0,0,.12); margin: 0 2px; }
  .proxy-row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    background: #c4c7cc; margin-right: 4px; vertical-align: middle; transition: all .2s;
  }
  .dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .18); }
  .dot.fail { background: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, .15); }
  .proxy-row input, .proxy-row select {
    padding: 8px 12px; font-size: 13px; color: var(--text);
    background: #fff;
    border: 1px solid #d9dce1; border-radius: 10px; outline: none;
  }
  .proxy-row select option { background: #fff; color: var(--text); }
  .proxy-row select { padding-right: 34px; min-width: 200px; }
  .proxy-row input { flex: 1; min-width: 200px; }
  .proxy-row input:focus, .proxy-row select:focus { border-color: rgba(0,0,0,.45); background: #fff; }
  .proxy-row .btn { padding: 8px 16px; font-size: 13px; }
  .ep-row { margin-top: 8px; display: flex; gap: 10px; align-items: stretch; }
  /* 批量按钮：与左侧选集按钮同高同字号，紧凑不喧宾夺主 */
  .ep-all-btn {
    align-self: flex-start; white-space: nowrap;
    padding: 8px 12px; font-size: 13px; font-weight: 500;
    border-radius: 10px; line-height: 1.4;
    flex: 1 1 auto; max-width: 320px;   /* 宽度与左侧选集一致（同 max-width 320px） */
  }
  .ep-select { position: relative; width: 100%; max-width: 320px; }
  .ep-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 12px; font-size: 13px; color: var(--text);
    background: #fff; border: 1px solid #d9dce1; border-radius: 10px;
    outline: none; cursor: pointer; font-family: inherit;
  }
  .ep-btn:hover { border-color: rgba(0,0,0,.3); }
  .ep-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep-pop {
    /* fixed 定位（JS 按按钮位置计算）：absolute 会被结果卡的 overflow:hidden 裁掉。
       关闭态靠 display:none，不设 left/top 默认值——否则向上翻清掉内联 top 时
       会回落到 -9999px（top 优先于 bottom），弹层直接飞出屏幕 */
    display: none; position: fixed;
    max-height: 240px; overflow-y: auto; z-index: 90;
    background: #fff; border: 1px solid #d9dce1; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.10); padding: 4px;
  }
  .ep-pop.open { display: block; }
  .ep-pop::-webkit-scrollbar { width: 6px; }
  .ep-pop::-webkit-scrollbar-track { background: transparent; }
  .ep-pop::-webkit-scrollbar-thumb { background: #d3d6db; border-radius: 3px; background-clip: padding-box; }
  .ep-pop::-webkit-scrollbar-thumb:hover { background: #b8bcc2; }
  .ep-item { padding: 7px 10px; font-size: 13px; color: var(--text); border-radius: 7px; cursor: pointer; }
  .ep-item:hover { background: #f2f3f5; }
  .ep-item.active { background: #eef0f2; color: #111; }
  .hint.ok { color: #16a34a; display: block; }
  .hint.bad { color: #b91c1c; display: block; }

  .msg {
    margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: 14px; display: none;
    background: rgba(0, 0, 0, 0.05); color: var(--text); border: 1px solid rgba(0, 0, 0, .12);
    white-space: pre-line;
  }
  .msg.error { display: block; }

  .result { margin-top: 24px; display: none; }
  .video-card { display: flex; overflow: hidden; }
  .cover-box { width: 320px; min-height: 200px; background: #17181a; position: relative; flex-shrink: 0; }
  .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-box .no-cover {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8a8f98; font-size: 13px; text-align: center; line-height: 1.7;
    padding: 0 22px; white-space: pre-line;
  }
  .cover-box .badge {
    position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.16); color: #fff;
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.25);
  }
  .cover-box .dur {
    position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff;
    font-size: 12px; padding: 3px 8px; border-radius: 6px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  /* 封面播放按钮（视频在线预览） */
  .cover-box .play-btn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(23,24,26,.72); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 3;
    transition: transform .15s ease, background .15s ease;
  }
  .cover-box:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: rgba(23,24,26,.9); }
  .cover-box .play-btn svg { display: block; }
  /* 灯箱视频模式 */
  #lbVideo { max-width: 92vw; max-height: 86vh; border-radius: 10px; background: #000; outline: none; }
  #lbAudio { width: min(72vw, 460px); border-radius: 10px; }
  .lb-note {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 13px; background: rgba(23,24,26,.66);
    padding: 6px 14px; border-radius: 999px; display: none; z-index: 3; white-space: nowrap;
  }
  .info-box { flex: 1; padding: 20px 22px; min-width: 0; }
  .info-box h2 { font-size: 18px; line-height: 1.45; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .author-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .author-row .avatar {
    width: 30px; height: 30px; border-radius: 50%; color: #fff;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .cookie-used { font-size: 12px; color: #8b8f96; margin-top: 8px; }
  .views { color: var(--muted); font-size: 13px; }

  .section-label { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .section-label .count { color: #9a9ea6; font-weight: 500; margin-left: 4px; }
  .res-list { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 图集预览网格 */
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 7px; }
  .img-cell {
    position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
    background: rgba(0, 0, 0, .05); border: 1px solid var(--line);
  }
  .img-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 全屏灯箱 */
  html.lb-open, html.lb-open body { overflow: hidden !important; overscroll-behavior: none; }
  .lightbox {
    position: fixed; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center;
    background: rgba(18, 19, 21, .93);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overscroll-behavior: contain; touch-action: none;
  }
  .lightbox img {
    max-width: 88vw; max-height: 84vh; border-radius: 8px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .55); user-select: none;
    transition: transform .16s ease-out; cursor: zoom-in;
    will-change: transform; touch-action: none; transform-origin: center center;
  }
  .lb-close, .lb-nav {
    position: fixed; z-index: 101; border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .15s;
  }
  .lb-close:hover, .lb-nav:hover { background: rgba(255, 255, 255, .24); }
  .lb-close { top: 18px; right: 22px; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; font-size: 17px; }
  .lb-prev { left: 22px; }
  .lb-next { right: 22px; }
  .lb-count {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, .78); font-size: 13px; letter-spacing: 1px;
  }
  .img-cell .more {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(100, 102, 106, .45); color: #fff; font-size: 13px; font-weight: 600;
    letter-spacing: .3px; text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
  }
  .chip {
    padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text);
    background: #fff; border: 1px solid #d9dce1;
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: rgba(0,0,0,.45); transform: translateY(-1px); }
  .chip.active {
    background: var(--dark);
    border-color: var(--dark); color: #fff;
  }
  .action-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  .progress-box { margin-top: 24px; display: none; }
  .progress-card { padding: 20px; }
  .progress-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
  .bar { height: 10px; background: #eef0f2; border: 1px solid rgba(0,0,0,.08);
    border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0;
    background: repeating-linear-gradient(45deg, #2a2d33, #2a2d33 10px, #3d4148 10px, #3d4148 20px);
    border-radius: 6px; transition: width .3s;
    animation: bar-flow 1s linear infinite; }
  /* 条纹持续流动：百分比长时间不变（如逐话下载中）也能看出没有卡住 */
  @keyframes bar-flow { to { background-position: 28.28px 0; } }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 12.5px; color: var(--muted); }
  .done-box { text-align: center; padding: 6px 0 2px; }
  .done-icon { width: 44px; height: 44px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.15); }
  .done-box p { margin: 10px 0 14px; font-size: 14px; color: var(--muted); word-break: break-all; }
  .done-box p.done-meta { margin: -6px 0 14px; font-size: 12.5px; color: #8b8f97; }
  .done-box .done-list { display: block; margin-top: 4px; font-size: 12px; opacity: .85; }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  /* 解析记录侧栏 */
  .history {
    flex: 0 0 300px; width: 300px; min-width: 300px; max-width: 300px;
    position: sticky; top: 24px;
    border-radius: 18px; padding: 16px 14px 12px;
  }
  .hist-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; padding: 0 4px; }
  .hist-clear { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .hist-clear:hover { color: #c0392b; background: rgba(0,0,0,.05); }
  .hist-tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  .hist-tab {
    flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 6px 0;
    border-radius: 8px; cursor: pointer; color: var(--text);
    background: #f2f3f5; border: 1px solid transparent;
    transition: all .15s;
  }
  .hist-tab:hover { border-color: rgba(0,0,0,.3); }
  .hist-tab.active { background: var(--dark); color: #fff; border-color: var(--dark); }
  .hist-list { max-height: 62vh; overflow-y: auto; }
  .hist-item {
    padding: 9px 10px; border-radius: 10px; cursor: pointer; position: relative;
    border: 1px solid transparent; transition: background .15s;
  }
  .hist-item:hover { background: #f2f3f5; }
  .hist-item .t { font-size: 13px; font-weight: 400; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .hist-item .m { font-size: 11px; color: var(--muted); margin-top: 3px;
    display: flex; gap: 6px; align-items: center; }
  .hist-item .badge { background: rgba(0,0,0,.06); border-radius: 4px; padding: 0 5px; letter-spacing: .3px; }
  .hist-item .del {
    visibility: hidden; position: absolute; right: 8px; top: 8px;
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
  }
  .hist-item:hover .del { visibility: visible; }
  .hist-item .del:hover { color: #c0392b; }
  .hist-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 22px; }
  .hist-list::-webkit-scrollbar { width: 4px; }
  .hist-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 2px; }
  .hist-list::-webkit-scrollbar-button { display: none; }
  @media (max-width: 1120px) {
    .cols { flex-direction: column; }
    .history { flex: auto; width: 100%; position: static; }
  }

  @media (max-width: 640px) {
    .video-card { flex-direction: column; }
    .cover-box { width: 100%; height: 210px; }
    .input-row { flex-direction: column; }
    .corner-fabs { top: 10px; right: 10px; flex-direction: row; align-items: center; gap: 8px; }
    .menu-btn { width: 34px; height: 34px; }
    .modal { padding: 20px 18px 16px; max-height: 88vh; }
  }
</style>
</head>

<div class="wrap">

// ---------------- 解析核心（yt-dlp）更新 ----------------
// 平台接口一改，旧版 yt-dlp 就会解析失败。打包后的程序没法 pip 升级，
// 所以这里从 PyPI 下载新版到程序目录的 core/，下次启动优先加载它。
async function loadCoreVer() {
  try {
    const d = await (await fetch("/api/core_status")).json();
    const el = document.getElementById("coreVer");
    if (el && d.ok) {
      el.textContent = "v" + d.version;
      el.title = d.user_core ? t("core_from_update") : t("core_from_bundled");
    }
  } catch (e) {}

async function updateCore() {
  const btn = document.getElementById("coreBtn");
  const msg = document.getElementById("coreMsg");
  if (!btn || btn.disabled) return;
  const label = btn.querySelector("span");
  const idle = t("core_update");
  btn.disabled = true;
  label.textContent = t("core_checking");
  msg.textContent = ""; msg.className = "menu-dldir-msg";
  try {
    const r = await fetchRetry("/api/update_core", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ proxy: getProxy() })
    });
    const d = await r.json();
    if (!d.ok) {
      msg.textContent = t("core_fail") + (d.error || "");
      msg.className = "menu-dldir-msg bad";
    } else if (d.up_to_date) {
      msg.textContent = t("core_latest").replace("{v}", d.version);
      msg.className = "menu-dldir-msg ok";
    } else {
      msg.textContent = t("core_updated").replace("{v}", d.version);
      msg.className = "menu-dldir-msg ok";
      loadCoreVer();
    }
  } catch (e) {
    msg.textContent = t("core_fail") + e;
    msg.className = "menu-dldir-msg bad";
  } finally {
    btn.disabled = false;
    label.textContent = idle;
  }
}

const HIST_KEY = "vyt_history";
let histItems = [];
try { histItems = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { histItems = []; }
let histFilter = "all";

function saveHistory() {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(histItems.slice(0, 60))); } catch (e) {}
}
function addHistory(rec) {
  histItems = histItems.filter(r => r.url !== rec.url);   // 同链接提到最前
  histItems.unshift(rec);
  histItems = histItems.slice(0, 60);
  saveHistory();
  renderHistory();
}
function removeHistory(url, ev) {
  if (ev) ev.stopPropagation();
  histItems = histItems.filter(r => r.url !== url);
  saveHistory();
  renderHistory();
}
function clearHistory() {
  histItems = [];
  saveHistory();
  renderHistory();
}
function histTime(ts) {
  const d = new Date(ts), now = new Date();
  const hm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  if (d.toDateString() === now.toDateString()) return hm;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
function renderHistory() {
  const tabs = document.getElementById("histTabs");
  const list = document.getElementById("histList");
  if (!tabs || !list) return;
  const labels = t("hist_types") || {};
  const tabsDef = [["all", t("hist_all")], ["video", labels.video || "Video"],
                   ["image", labels.image || "Gallery"], ["audio", labels.audio || "Audio"]];
  tabs.innerHTML = "";
  tabsDef.forEach(([key, label]) => {
    const n = key === "all" ? histItems.length : histItems.filter(r => r.type === key).length;
    const tab = document.createElement("div");
    tab.className = "hist-tab" + (histFilter === key ? " active" : "");
    tab.textContent = label + (n ? " " + n : "");
    tab.onclick = () => { histFilter = key; renderHistory(); };
    tabs.appendChild(tab);
  });

  const shown = histFilter === "all" ? histItems : histItems.filter(r => r.type === histFilter);
  list.innerHTML = "";
  if (!shown.length) {
    const empty = document.createElement("div");
    empty.className = "hist-empty";
    empty.textContent = t("hist_empty");
    list.appendChild(empty);
    return;
  }
  shown.forEach(rec => {
    const item = document.createElement("div");
    item.className = "hist-item";
    item.onclick = () => {
      document.getElementById("urlInput").value = rec.url;
      analyze();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    const tEl = document.createElement("div");
    tEl.className = "t"; tEl.textContent = rec.title;
    const mEl = document.createElement("div");
    mEl.className = "m";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = ((rec.platform || "").toUpperCase() || "--") + " · " + (labels[rec.type] || rec.type);
    const time = document.createElement("span");
    time.textContent = histTime(rec.ts);
    mEl.appendChild(badge); mEl.appendChild(time);
    const del = document.createElement("button");
    del.className = "del"; del.innerHTML = "&#10005;"; del.title = "Delete";
    del.onclick = (e) => removeHistory(rec.url, e);
    item.appendChild(tEl); item.appendChild(mEl); item.appendChild(del);
    list.appendChild(item);
  });
}

// 网络请求失败自动重试：开发模式下改代码会重启服务（几秒），
// 这期间的请求会连接失败，重试即可无缝恢复；服务真没开时重试完才报错。
const NET_RETRY_MAX = 8, NET_RETRY_DELAY = 1500;
async function fetchRetry(url, opts) {
  let notified = false;
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch(url, opts);
      if (notified) hideError();   // 重试成功了，撤掉重试提示
      return res;
    } catch (e) {
      if (attempt >= NET_RETRY_MAX) throw e;
      notified = true;
      showError(t("net_retry").replace("{n}", attempt + 1).replace("{max}", NET_RETRY_MAX));
      await new Promise(r => setTimeout(r, NET_RETRY_DELAY));
    }
  }
}

// ---------------- connection health ----------------
// A tab can outlive the server (crash / dev-mode restart): the page still
// renders but every request is refused. Ping in the background and show one
// clear banner instead of letting each button report a made-up reason.
let connDown = false;
function setConnDown(down, detail) {
  connDown = down;
  const bar = document.getElementById("connBar");
  if (!bar) return;
  bar.hidden = !down;
  if (down) {
    document.getElementById("connText").textContent =
      t("conn_down") + (detail ? "  [" + detail + "]" : "");
  }
}
async function checkConn(manual) {
  try {
    const r = await fetch("/api/ping", { cache: "no-store" });
    // 404 means an older build without /api/ping: the server is alive anyway
    if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
    setConnDown(false);
    if (manual) hideError();
    return true;
  } catch (e) {
    setConnDown(true, (e && e.name ? e.name + ": " + e.message : String(e)));
    return false;
  }
}
// Three quick attempts, then keep the original browser error so the message
// describes what really happened instead of blaming the server blindly.
async function apiFetch(url, opts) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { return await fetch(url, opts); }
    catch (e) {
      last = e;
      if (i < 2) await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  throw last;
}
setInterval(() => checkConn(false), 15000);
window.addEventListener("load", () => checkConn(false));

async function postJSON(url, body) {
  let res;
  try {
    res = await fetchRetry(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  } catch (e) {
    throw new Error(t("err_net"));
  }  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(t("err_server_bad"));
  }
  return { ok: res.ok, data };
}
function localizeError(data) {
  const code = data.code || "ERR_GENERIC";
  const key = "ERR_" + code;
  if (I18N[lang][key]) {
    let msg = t(key);
    // 视频号类错误：后端带有更具体的原因，附在模板后面便于排查
    if (String(code).indexOf("SPH_") === 0) {
      const extra = data.error && data.error !== code ? data.error : (data.detail || "");
      if (extra && extra !== "no cookie" && msg.indexOf(extra) === -1) {
        msg += (lang === "en" ? " | detail: " : "｜具体原因：") + extra;
      }
    }
    return msg;
  }
  return data.error || data.detail || t("ERR_GENERIC");
}

// ---------------- analyze ----------------
async function analyze() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) { showErrorSpec({ key: "err_empty" }); return; }
  hideError();
  const btn = document.getElementById("analyzeBtn");
  btn.disabled = true; btn.textContent = t("analyzing");
  // 影视站封面先行：并行发一个只取「片名+封面」的快照请求（不碰视频源），
  // 回来就先把结果卡画出来，时长/画质/下载按钮等完整解析完成后补齐
  let fullSettled = false;
  fetch("/api/film_cover?url=" + encodeURIComponent(url))
    .then(r => r.json())
    .then(d => {
      if (fullSettled || !d || !d.film || !d.cover) return;
      renderResult({
        title: d.title || "", author: d.platform || "", cover: d.cover,
        platform: d.platform || "", content_type: "video",
        duration: "", resolutions: [], episodes: [], images: [], _early: true
      }, false);
    })
    .catch(() => {});
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 90000);
    const res = await apiFetch("/api/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, proxy: getProxy(), cookie_browser: getCookieBrowser() }),
      signal: controller.signal
    });
    clearTimeout(timer);
    let data;
    try { data = await res.json(); }
    catch (e) { showErrorSpec({ key: "err_server_bad" }); return; }
    if (!res.ok) {
      fullSettled = true;
      if (lastInfo && lastInfo._early) {   // 快照卡先出来了但完整解析失败：收起快照卡
        lastInfo = null;
        document.getElementById("result").style.display = "none";
      }
      showErrorSpec({ data });
      // 视频号要一次性配置元宝 Cookie：直接把配置面板放出来
      if (String(data.code || "").startsWith("SPH_")) showSphPanel(true);
      return;
    }
    fullSettled = true;                  // 完整结果已到，快照不再覆盖
    showSphPanel(false);
    currentUrl = data.webpage || url;
    renderResult(data, true);
    addHistory({
      url: currentUrl,
      title: data.title || url,
      platform: data.platform || "",
      type: data.content_type || "video",
      count: data.image_count || 0,
      ts: Date.now(),
    });
  } catch (e) {
    // 超时（AbortError）和网络不通是两回事，别都甩锅给「服务没开」；
    // 非超时错误把浏览器原始报错一起显示，避免下次又靠猜。
    if (lastInfo && lastInfo._early) {
      lastInfo = null;
      document.getElementById("result").style.display = "none";
    }
    if (e && e.name === "AbortError") {
      showErrorSpec({ key: "err_timeout" });
    } else {
      console.error("[analyze] request failed:", e);
      showErrorSpec({ raw: t("err_net") + "  [" + (e && e.name) + ": " + (e && e.message) + "]" });
      checkConn(false);
    }
  } finally {
    fullSettled = true;                  // 失败/超时也不让快照再渲染结果卡
    btn.disabled = false; btn.textContent = t("analyze_btn");
  }
}

// ---------------- render ----------------
const HEIGHT_MAP = { "8K": 4320, "4K": 2160, "2K": 1440, "1080P": 1080, "720P": 720, "480P": 480, "360P": 360 };

function renderResult(info, isNew) {
  lastInfo = info;
  const early = !!info._early;         // 快照先行阶段（完整解析尚未返回）
  // 新解析时复位该链接的保存状态；语言切换等重渲染不复位
  if (isNew) { savedMap[currentUrl] = {}; persistSaved(); }
  const ctype = info.content_type || "video";
  const isVideo = ctype === "video", isImage = ctype === "image", isAudio = ctype === "audio";

  document.getElementById("result").style.display = "block";
  document.getElementById("progressBox").style.display = "none";

  document.getElementById("titleText").textContent = info.title || t("unknown");
  document.getElementById("authorText").textContent = info.author || t("unknown");
  document.getElementById("authorAvatar").textContent = (info.author || "?")[0].toUpperCase();
  document.getElementById("viewsText").textContent =
    info.views ? Number(info.views).toLocaleString() + t("views_suffix") : "";
  // 自动模式用了哪份登录态，明确告诉用户
  const usedEl = document.getElementById("cookieUsed");
  const usedMap = { edge: "Edge", chrome: "Chrome", firefox: "Firefox", manual: t("cookie_manual") };
  if (info.cookie_used && usedMap[info.cookie_used]) {
    usedEl.textContent = t("cookie_used")(usedMap[info.cookie_used]);
    usedEl.style.display = "";
  } else {
    usedEl.style.display = "none";
  }
  const plat = (info.platform || "").toUpperCase();
  document.getElementById("platformBadge").textContent =
    plat + (t("type_" + ctype) ? " · " + t("type_" + ctype) : "");
  const dur = info.duration && info.duration !== "--:--" ? info.duration : "";
  document.getElementById("durBadge").style.display = dur ? "" : "none";
  document.getElementById("durBadge").textContent = dur;

  // 下载前预览：视频点封面播放、图集点图放大、音频一键试听
  const previewUrl = info.preview_url || info.xhs_video_url || "";
  const canPreview = (isVideo || isAudio) && !!previewUrl;

  const coverBox = document.getElementById("coverBox");
  coverBox.style.cursor = info.cover
    ? (ctype === "image" || canPreview ? "pointer" : "zoom-in")
    : "";
  coverBox.onclick = null;
  document.getElementById("playBtn").style.display = (canPreview && info.cover) ? "" : "none";
  if (info.cover) {
    setCoverImg(info.cover, info.webpage);
    coverBox.onclick = ctype === "image"
      ? () => openLightbox((info.images || []).map(x => x.url), 0)
      : (canPreview ? () => openPreview() : () => openLightbox([info.cover], 0));
  }

  // 视频的预览走「点封面播放」（音乐同理，点封面即试听），不再单独放试听按钮

  // 视频封面 / 音乐封面：可单独保存成图片
  const coverBtnEl = document.getElementById("coverBtn");
  coverBtnEl.style.display = ((isVideo || isAudio) && info.cover && !early) ? "" : "none";
  updateCoverBtn();
  const lyricsBtnEl = document.getElementById("lyricsBtn");
  lyricsBtnEl.style.display = (isAudio && info.lyrics) ? "" : "none";
  updateLyricsBtn();

  // 按内容类型切换操作区（快照先行阶段还没有时长/画质，下载按钮先收起，完整解析后恢复）
  document.getElementById("resSec").style.display = isVideo ? "" : "none";
  document.getElementById("dlVideoBtn").style.display = (isVideo && !early) ? "" : "none";
  document.getElementById("dlAudioBtn").style.display = (isVideo && !early) ? "" : "none";
  document.getElementById("dlMusicBtn").style.display = isAudio ? "" : "none";
  document.getElementById("musicHint").style.display = isAudio ? "" : "none";
  const lyricsHintEl = document.getElementById("lyricsHint");
  if (isAudio) {
    // 有歌词讲嵌入/导出的区别；没歌词（纯音乐）说明原因
    const key = info.lyrics ? "lyrics_hint" : "lyrics_none";
    lyricsHintEl.setAttribute("data-i18n", key);
    lyricsHintEl.innerHTML = t(key);
    lyricsHintEl.style.display = "";
  } else {
    lyricsHintEl.style.display = "none";
  }
  updateDlBtns();

  // 视频分辨率档位（快照先行阶段显示「解析中」，完整解析后补档位）
  const list = document.getElementById("resList");
  list.innerHTML = "";
  if (isVideo && early) {
    document.getElementById("resLabel").textContent = t("analyzing");
  } else if (isVideo) {
    const tiers = info.resolutions && info.resolutions.length ? info.resolutions : ["720P"];
    // 档位来自平台实际提供的画质流：最高档即原视频上限，标注出来避免误会
    const topLabel = tiers[tiers.length - 1] === "原画" ? t("res_original") : tiers[tiers.length - 1];
    document.getElementById("resLabel").textContent =
      t("sec_res") + " · " + t("res_max")(topLabel);
    // 默认永远选最高档（原画质），用户可手动降档；不沿用上一条视频的选择
    selectedHeight = HEIGHT_MAP[tiers[tiers.length - 1]] || 0;
    topTierHeight = selectedHeight;
    tiers.forEach((label) => {
      const chip = document.createElement("div");
      const h = HEIGHT_MAP[label] || 0;
      chip.className = "chip" + (h === selectedHeight ? " active" : "");
      chip.dataset.h = h;
      chip.textContent = label === "原画" ? t("res_original") : label + (label === "1080P" ? " (1K)" : "");
      list.appendChild(chip);
    });
    list.onclick = (e) => {
      const chip = e.target.closest(".chip");
      if (chip) {
        list.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        selectedHeight = parseInt(chip.dataset.h || "0", 10) || 0;
        // 换档位后按钮状态按新档位重新判断（同档位下载过才保持锁定）
        updateDlBtns();
      }
    };
  }

  // 影视站多集影片：自绘剧集下拉（原生 select 弹层滚动条无法定制），预览跟随选集
  const epSec = document.getElementById("epSec");
  const epBtn = document.getElementById("epBtn");
  const epLabel = document.getElementById("epLabel");
  const epPop = document.getElementById("epPop");
  selectedEpisodeUrl = "";
  epPop.classList.remove("open");
  const eps = ((isVideo || isImage) && Array.isArray(info.episodes)) ? info.episodes : [];
  const epAllBtn = document.getElementById("epAllBtn");
  if (eps.length > 1) {
    epPop.innerHTML = "";
    // 漫画（图集）是「选话」：区块标签与批量按钮都换成漫画措辞
    const secLabel = document.querySelector("#epSec .section-label");
    if (secLabel) secLabel.textContent = isImage ? t("sec_ep_manga") : t("sec_ep");
    updateEpAllBtn();   // 按状态渲染：正常 / 下载中 / 已下载全话(集)
    eps.forEach((ep) => {
      const it = document.createElement("div");
      it.className = "ep-item";
      it.textContent = ep.label || ep.url;
      it.onclick = () => epPick(ep, it);
      epPop.appendChild(it);
    });
    epLabel.textContent = eps[0].label || "";
    // fixed 定位弹层：贴着按钮下方弹出，下方空间不足时向上翻，滚动/缩放跟随
    const placeEpPop = () => {
      const r = epBtn.getBoundingClientRect();
      epPop.style.left = r.left + "px";
      epPop.style.width = r.width + "px";
      const below = window.innerHeight - r.bottom - 8;   // 下方可用空间
      const above = r.top - 8;                            // 上方可用空间
      if (below >= 260 || above < 120 || below >= above) {
        // 下方放得下（或上方更放不下/下方空间更大）：向下弹
        epPop.style.top = (r.bottom + 4) + "px";
        epPop.style.bottom = "";
        epPop.style.maxHeight = Math.min(240, Math.max(below, 120)) + "px";
      } else {                                            // 下方不够：向上翻
        epPop.style.top = "";
        epPop.style.bottom = (window.innerHeight - r.top + 4) + "px";
        epPop.style.maxHeight = Math.min(240, above) + "px";
      }
    };
    epBtn.onclick = (e) => {
      e.stopPropagation();
      if (epPop.classList.contains("open")) { epPop.classList.remove("open"); return; }
      placeEpPop();
      epPop.classList.add("open");
    };
    if (!epBtn.dataset.bound) {          // 点弹层外面收起 + 滚动跟随（只绑一次）
      epBtn.dataset.bound = "1";
      document.addEventListener("click", (e) => {
        if (!document.getElementById("epSelect").contains(e.target)) epPop.classList.remove("open");
      });
      window.addEventListener("scroll", () => {
        if (epPop.classList.contains("open")) placeEpPop();
      }, true);
      window.addEventListener("resize", () => {
        if (epPop.classList.contains("open")) placeEpPop();
      });
    }
    epSec.style.display = "";
  } else {
    epPop.innerHTML = "";
    epSec.style.display = "none";
    if (epAllBtn) epAllBtn.textContent = "";
  }

  // 图集预览（渲染逻辑在 renderImgGrid，选话切换时也会单独调用）
  renderImgGrid(info);
}

// 封面图渲染（renderResult 与漫画选话换封面共用）：代理优先级与失败兜底逻辑一致
function setCoverImg(coverUrl, webpage) {
  const coverBox = document.getElementById("coverBox");
  const nocover = coverBox.querySelector(".no-cover");
  coverBox.querySelectorAll("img").forEach(i => i.remove());
  nocover.style.display = "";
  nocover.textContent = t("no_cover");
  if (!coverUrl) return;
  const img = document.createElement("img");
  img.referrerPolicy = "no-referrer";
  img.onload = () => { nocover.style.display = "none"; };
  // 填了代理就优先走本地代理（浏览器自身不走代理，直连会被墙）；
  // 否则先直连，失败再走代理；两条都失败 => 明确提示网络受限
  const viaProxy = imgProxyUrl(coverUrl, webpage);
  let useProxyFirst = !!getProxy();
  try {
    // 豆瓣图床严格防盗链（浏览器直连必 403），直接走本地代理
    if (/(^|\.)doubanio\.com$/.test(new URL(coverUrl, location.href).hostname))
      useProxyFirst = true;
  } catch (_) {}
  img.onerror = () => {
    const tries = img.dataset.tries ? Number(img.dataset.tries) : 0;
    img.dataset.tries = String(tries + 1);
    if (tries === 0) {
      img.src = img.src.indexOf("/api/image_proxy") === -1 ? viaProxy : coverUrl;
      return;
    }
    img.remove();
    nocover.style.display = "";
    nocover.textContent = t("cover_net_fail");
  };
  img.dataset.tries = "0";
  img.src = useProxyFirst ? viaProxy : coverUrl;
  coverBox.prepend(img);
}

// 图集预览（渲染逻辑在 renderImgGrid，选话切换时也会单独调用）
function renderImgGrid(info) {
  const isImage = (info.content_type || "video") === "image";
  document.getElementById("imgSec").style.display = isImage ? "" : "none";
  document.getElementById("dlImagesBtn").style.display = isImage ? "" : "none";
  const grid = document.getElementById("imgGrid");
  grid.innerHTML = "";
  document.getElementById("imgCountText").textContent =
    isImage ? t("img_count")(info.image_count || (info.images || []).length) : "";
  if (isImage) {
    const shown = (info.images || []).slice(0, 8);
    const urls = (info.images || []).map(x => x.url);
    shown.forEach((im, idx) => {
      const cell = document.createElement("div");
      cell.className = "img-cell";
      cell.style.cursor = "zoom-in";
      cell.onclick = () => openLightbox(urls, idx);
      const img = document.createElement("img");
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.src = imgProxyUrl(im.url);
      img.onerror = () => { img.onerror = null; img.src = im.url; };
      cell.appendChild(img);
      grid.appendChild(cell);
    });
    const rest = (info.image_count || 0) - shown.length;
    if (rest > 0) {
      const cell = document.createElement("div");
      cell.className = "img-cell";
      cell.style.cursor = "zoom-in";
      // 底下铺下一张真实图片，上面盖半透明灰遮罩，既能看到图片内容又突出 +N
      const nextIm = urls[shown.length] ? { url: urls[shown.length] } : null;
      if (nextIm) {
        const img = document.createElement("img");
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.src = imgProxyUrl(nextIm.url);
        img.onerror = () => { img.onerror = null; img.src = nextIm.url; };
        cell.appendChild(img);
      }
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = `+${rest}`;
      cell.appendChild(more);
      cell.onclick = () => openLightbox(urls, Math.min(shown.length, urls.length - 1));
      grid.appendChild(cell);
    }
  }
}

/* ---- 全屏灯箱：滚轮/双指缩放、拖动平移、背景滚动锁定 ---- */
let lbList = [], lbIdx = 0;
let lbMode = "image";                  // image | video | audio
let lbHls = null;                      // hls.js 实例（m3u8 分片流预览用）
function loadHls(cb) {                 // 按需加载内置的 hls.js（vendor 内置，无外网依赖）
  if (window.Hls) { cb(window.Hls); return; }
  const s = document.createElement("script");
  s.src = "/vendor/hls.light.min.js";
  s.onload = () => cb(window.Hls || null);
  s.onerror = () => cb(null);
  document.head.appendChild(s);
}
let lbScale = 1, lbTx = 0, lbTy = 0;   // 当前缩放与平移（相对适配尺寸）
let lbDrag = null, lbPinch = null, lbMoved = false, lbOpenedAt = 0;
const LB_MIN = 1, LB_MAX = 8;

function lbImgEl() { return document.getElementById("lbImg"); }
function lbBox() { return document.getElementById("lightbox"); }
function lbIsOpen() { const el = lbBox(); return !!el && el.style.display !== "none"; }

/* 应用变换：动画只给按钮/键盘用，滚轮和拖动时禁用过渡避免滞后 */
function lbApply(animate) {
  const img = lbImgEl(); if (!img) return;
  img.style.transition = animate ? "transform .16s ease-out" : "none";
  img.style.transform = "translate3d(" + lbTx + "px," + lbTy + "px,0) scale(" + lbScale + ")";
  img.style.cursor = lbScale > 1.01 ? (lbDrag ? "grabbing" : "grab") : "zoom-in";
  const showNav = lbMode === "image" && lbList.length > 1 && lbScale <= 1.01;
  document.querySelectorAll(".lb-nav").forEach(n => { n.style.visibility = showNav ? "" : "hidden"; });
}
function lbReset() { lbScale = 1; lbTx = 0; lbTy = 0; lbApply(true); }

/* 限制平移范围：放大后的图边缘最多留 12% 在视口内 */
function lbClampPan() {
  if (lbScale <= 1.001) { lbTx = 0; lbTy = 0; return; }
  const img = lbImgEl(); if (!img) return;
  const w = img.clientWidth * lbScale, h = img.clientHeight * lbScale;
  const vw = window.innerWidth, vh = window.innerHeight;
  const maxX = Math.max(0, (w - vw) / 2 + vw * 0.12);
  const maxY = Math.max(0, (h - vh) / 2 + vh * 0.12);
  lbTx = Math.min(maxX, Math.max(-maxX, lbTx));
  lbTy = Math.min(maxY, Math.max(-maxY, lbTy));
}

/* 以屏幕点 (cx, cy) 为锚点缩放 factor 倍（图片在 flex 容器里居中，中心 = 视口中心 + 平移量） */
function lbZoomAt(factor, cx, cy) {
  const prev = lbScale;
  const next = Math.min(LB_MAX, Math.max(LB_MIN, prev * factor));
  if (Math.abs(next - prev) < 1e-4) return;
  const ox = cx - (window.innerWidth / 2 + lbTx);
  const oy = cy - (window.innerHeight / 2 + lbTy);
  const k = next / prev;
  lbTx = ox * (1 - k) + lbTx;      // 让光标下的像素保持不动
  lbTy = oy * (1 - k) + lbTy;
  lbScale = next;
  if (lbScale <= LB_MIN + 0.001) { lbTx = 0; lbTy = 0; }
  lbClampPan();
  lbApply(false);   // 滚轮缩放即时跟手，不加过渡
}

function openLightbox(list, idx) {
  if (!list || !list.length) return;
  lbMode = "image";
  lbList = list; lbIdx = Math.max(0, Math.min(idx, list.length - 1));
  const lb = lbBox();
  lbBind();
  // 从视频/音频模式切回图片：停掉播放器并复原图片与控制按钮
  lbStopMedia();
  lb.style.display = "flex";
  lbLockScroll(true);
  lbScale = 1; lbTx = 0; lbTy = 0;     // 每次打开都从适配大小开始
  lbOpenedAt = Date.now();
  lbImgEl().style.display = "";
  document.querySelectorAll(".lb-nav").forEach(n => { n.style.display = ""; });
  document.getElementById("lbCount").style.display = "";
  lbRender();
  document.addEventListener("keydown", lbKeys);
}

/* 视频/音频在线预览：直接播平台流，无需先下载 */
function previewProxyUrl(u, ref) {
  const q = new URLSearchParams({
    url: u, ref: ref || "", proxy: getProxy(), cookie: getCookieBrowser()
  });
  return "/api/video_preview?" + q.toString();
}
/* 影视站选集：更新选中态 + 让预览跟随切换（弹层开着就无缝换流） */
async function epPick(ep, optEl) {
  selectedEpisodeUrl = ep.url || "";
  const labelEl = document.getElementById("epLabel");
  if (labelEl) labelEl.textContent = ep.label || ep.url || "";
  const pop = document.getElementById("epPop");
  if (pop) {
    pop.classList.remove("open");
    pop.querySelectorAll(".ep-item").forEach(n => n.classList.toggle("active", n === optEl));
  }
  if (!selectedEpisodeUrl) return;
  // 漫画（图集）选话：拉取所选话的页图刷新预览网格（下载走 play_url 同一链接）
  if (lastInfo && lastInfo.content_type === "image") {
    try {
      const res = await fetchRetry("/api/manga_preview?url=" + encodeURIComponent(selectedEpisodeUrl));
      const data = await res.json();
      if (!res.ok) return;
      lastInfo.images = data.images || [];
      lastInfo.image_count = data.image_count || 0;
      // 封面跟随所选话：换成这一话的第一页（同时更新点击灯箱范围）
      const firstPage = (lastInfo.images || [])[0];
      if (firstPage && firstPage.url) {
        lastInfo.cover = firstPage.url;
        setCoverImg(lastInfo.cover, lastInfo.webpage);
        document.getElementById("coverBox").onclick =
          () => openLightbox(lastInfo.images.map(x => x.url), 0);
      }
      renderImgGrid(lastInfo);
    } catch (e) { /* 预览刷新失败不打断选集，下载不受影响 */ }
    return;
  }
  try {
    const res = await fetchRetry("/api/film_preview?url=" + encodeURIComponent(selectedEpisodeUrl));
    const data = await res.json();
    if (!res.ok || !data.preview_url) return;
    lastInfo.preview_url = data.preview_url;
    const lb = lbBox();
    if (lbMode === "video" && lb.style.display === "flex") {
      openPreview();                     // 内部会先停掉旧流再播新集
    }
  } catch (e) { /* 预览解析失败不打断选集，下载不受影响 */ }
}
function openPreview() {
  const info = lastInfo || {};
  const u = info.preview_url || info.xhs_video_url || "";
  if (!u) { showErrorSpec({ key: "preview_fail" }); return; }
  hideError();
  const kind = info.content_type === "audio" ? "audio" : "video";
  lbMode = kind;
  const lb = lbBox();
  lbBind();
  lbStopMedia();
  lb.style.display = "flex";
  lbLockScroll(true);
  lbScale = 1; lbTx = 0; lbTy = 0;
  lbOpenedAt = Date.now();
  const img = lbImgEl();
  img.style.display = "none"; img.removeAttribute("src");
  document.querySelectorAll(".lb-nav").forEach(n => { n.style.display = "none"; });
  document.getElementById("lbCount").style.display = "none";
  const el = document.getElementById(kind === "audio" ? "lbAudio" : "lbVideo");
  el.style.display = "block";   // 内联样式控制显隐（CSS 里不再写 display:none）
  // 小红书原片常是 HEVC（浏览器未必能播）：播不了自动退回 h264 转码流
  el.dataset.fb = info.preview_fallback_url
    ? previewProxyUrl(info.preview_fallback_url, info.webpage) : "";
  el.onerror = () => {
    const fb = el.dataset.fb || "";
    if (fb && el.src !== fb) {
      el.dataset.fb = "";
      el.src = fb;
      el.play().catch(() => {});
    }
  };
  el.src = previewProxyUrl(u, info.webpage);
  if (/\.m3u8(\?|$)/i.test(u)) {
    // HLS 分片流（影视站等）：原生 <video> 播不了，交给 hls.js 经本地代理取流
    el.removeAttribute("src");
    loadHls((Hls) => {
      if (lbMode !== "video") return;          // 弹层已关闭/切换，别再挂流
      if (!Hls) { showErrorSpec({ key: "preview_fail" }); return; }
      if (Hls.isSupported()) {
        lbHls = new Hls({ maxBufferLength: 30 });
        lbHls.on(Hls.Events.ERROR, (_ev, d) => {
          if (d.fatal) showErrorSpec({ key: "preview_fail" });
        });
        lbHls.loadSource(previewProxyUrl(u, info.webpage));
        lbHls.attachMedia(el);
      } else {
        el.src = previewProxyUrl(u, info.webpage);   // Safari 原生支持 HLS
      }
      el.play().catch(() => {});
    });
  }
  if (kind === "video") {
    // DASH 平台（B站等）画面与声音是两条流：额外播一条音频并与画面同步
    const au = document.getElementById("lbAudio");
    if (info.preview_audio_url) {
      au.src = previewProxyUrl(info.preview_audio_url, info.webpage);
      au.dataset.hidden = "1";
      bindAvSync(el, au);
    } else {
      au.removeAttribute("src");
    }
  }
  el.play().catch(() => {});   // 浏览器可能拦截自动播放，控件里手动点即可
  const note = document.getElementById("lbNote");
  if (kind === "video" && info.preview_silent && !info.preview_audio_url) {
    note.textContent = t("preview_silent"); note.style.display = "";
  } else {
    note.style.display = "none";
  }
  document.addEventListener("keydown", lbKeys);
}

/* 画面 + 独立音频流的同步：播放/暂停/拖动/倍速/音量全部跟随视频 */
function bindAvSync(video, audio) {
  if (video.dataset.avBound) return;
  video.dataset.avBound = "1";
  const sync = (force) => {
    if (force || Math.abs(video.currentTime - audio.currentTime) > 0.3) {
      try { audio.currentTime = video.currentTime; } catch (_) {}
    }
  };
  video.addEventListener("play", () => { sync(true); audio.play().catch(() => {}); });
  video.addEventListener("playing", () => sync(true));
  video.addEventListener("pause", () => audio.pause());
  video.addEventListener("seeked", () => sync(true));
  video.addEventListener("timeupdate", () => sync(false));
  video.addEventListener("ratechange", () => { audio.playbackRate = video.playbackRate; });
  video.addEventListener("volumechange", () => {
    audio.volume = video.volume;
    audio.muted = video.muted;
  });
  video.addEventListener("ended", () => audio.pause());
}
function lbStopMedia() {
  if (lbHls) { try { lbHls.destroy(); } catch (_) {} lbHls = null; }
  [document.getElementById("lbVideo"), document.getElementById("lbAudio")].forEach(el => {
    if (!el) return;
    el.onerror = null;
    el.dataset.fb = "";
    el.pause();
    el.removeAttribute("src");
    try { el.load(); } catch (_) {}
    el.style.display = "none";
  });
  const note = document.getElementById("lbNote");
  if (note) note.style.display = "none";
}
function closeLightbox() {
  const lb = lbBox(); if (!lb) return;
  lb.style.display = "none";
  lbStopMedia();
  lbLockScroll(false);
  document.removeEventListener("keydown", lbKeys);
  lbDrag = null; lbPinch = null;
}
function lbRender() {
  lbScale = 1; lbTx = 0; lbTy = 0;
  lbReset();
  const img = lbImgEl();
  const u = lbList[lbIdx];
  img.onerror = () => { img.onerror = null; img.src = u; };
  img.src = imgProxyUrl(u);
  document.getElementById("lbCount").textContent = (lbIdx + 1) + " / " + lbList.length;
}
function lbStep(d) {
  if (lbList.length < 2) return;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  lbRender();
}
function lbKeys(e) {
  if (!lbIsOpen()) return;
  if (e.key === "Escape") { closeLightbox(); return; }
  if (lbMode !== "image") return;   // 播放中不响应缩放/翻页快捷键
  if (e.key === "ArrowLeft") { e.preventDefault(); lbStep(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); lbStep(1); }
  else if (e.key === "+" || e.key === "=") { e.preventDefault(); lbZoomAt(1.4, window.innerWidth / 2, window.innerHeight / 2); }
  else if (e.key === "-" || e.key === "_") { e.preventDefault(); lbZoomAt(1 / 1.4, window.innerWidth / 2, window.innerHeight / 2); }
  else if (e.key === "0") { e.preventDefault(); lbReset(); }
}

/* 背景滚动锁定：html/body 禁止滚动，并补偿滚动条宽度避免页面跳动 */
function lbLockScroll(on) {
  const html = document.documentElement, body = document.body;
  if (on) {
    const sw = window.innerWidth - html.clientWidth;
    body.dataset.lbPad = body.style.paddingRight || "";
    if (sw > 0) body.style.paddingRight = sw + "px";
    html.classList.add("lb-open");
    body.classList.add("lb-open");
  } else {
    html.classList.remove("lb-open");
    body.classList.remove("lb-open");
    body.style.paddingRight = body.dataset.lbPad || "";
  }
}

/* 事件只绑定一次，且在灯箱打开时绑定（元素一定已存在） */
function lbBind() {
  const lb = lbBox();
  if (!lb || lb.dataset.bound) return;
  lb.dataset.bound = "1";

  // 滚轮：仅灯箱内生效，阻止背景滚动
  lb.addEventListener("wheel", (e) => {
    e.preventDefault(); e.stopPropagation();
    if (lbMode !== "image") return;    // 视频/音频模式只锁背景，不缩放
    const step = e.deltaMode === 1 ? 0.06 : 0.0022;   // 行模式 / 像素模式
    let factor = Math.exp(-e.deltaY * step);
    factor = Math.min(1.35, Math.max(1 / 1.35, factor));   // 单次事件最多 1.35x，快速滚动不跳档
    lbZoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  // 双击：1x <-> 2.5x（刚打开时的双击来自“点开图片”那一下，忽略，避免一进来就是放大状态）
  lb.addEventListener("dblclick", (e) => {
    if (lbMode !== "image") return;
    if (Date.now() - lbOpenedAt < 450) return;
    if (e.target.closest(".lb-close, .lb-nav")) return;
    e.preventDefault();
    if (lbScale > 1.01) lbReset();
    else lbZoomAt(2.5 / lbScale, e.clientX, e.clientY);
  });

  // 拖动平移（在整层上监听，鼠标滑出图片范围也能继续拖）
  lb.addEventListener("pointerdown", (e) => {
    if (lbMode !== "image") return;
    if (e.button !== 0) return;
    if (e.target.closest(".lb-close, .lb-nav")) return;
    if (lbScale <= 1.01) return;
    e.preventDefault();
    lbDrag = { x: e.clientX, y: e.clientY, tx: lbTx, ty: lbTy };
    lbMoved = false;
    try { lb.setPointerCapture(e.pointerId); } catch (_) {}
    lbApply(false);
  });
  lb.addEventListener("pointermove", (e) => {
    if (!lbDrag) return;
    const dx = e.clientX - lbDrag.x, dy = e.clientY - lbDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) lbMoved = true;
    lbTx = lbDrag.tx + dx;
    lbTy = lbDrag.ty + dy;
    lbClampPan();
    lbApply(false);
  });
  ["pointerup", "pointercancel"].forEach(ev => lb.addEventListener(ev, () => {
    if (!lbDrag) return;
    lbDrag = null;
    lbApply(true);
    if (lbMoved) setTimeout(() => { lbMoved = false; }, 0);  // 拖动结束不当作点击背景
  }));

  // 点击空白处关闭（拖动过则忽略）
  lb.addEventListener("click", (e) => {
    if (lbMoved) return;
    if (e.target === lb) closeLightbox();
  });

  // 触屏：双指捏合缩放 + 单指（放大后）平移
  lb.addEventListener("touchstart", (e) => {
    if (lbMode !== "image") return;
    if (e.touches.length === 2) {
      e.preventDefault();
      const [a, b] = e.touches;
      lbPinch = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
      lbDrag = null;
    } else if (e.touches.length === 1 && lbScale > 1.01) {
      const t = e.touches[0];
      lbDrag = { x: t.clientX, y: t.clientY, tx: lbTx, ty: lbTy };
    }
  }, { passive: false });
  lb.addEventListener("touchmove", (e) => {
    if (lbMode !== "image") return;
    if (e.touches.length === 2 && lbPinch) {
      e.preventDefault();
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
      lbZoomAt(dist / lbPinch.dist, cx, cy);
      lbPinch.dist = dist;
    } else if (e.touches.length === 1 && lbDrag) {
      e.preventDefault();
      const t = e.touches[0];
      lbTx = lbDrag.tx + (t.clientX - lbDrag.x);
      lbTy = lbDrag.ty + (t.clientY - lbDrag.y);
      lbClampPan();
      lbApply(false);
    }
  }, { passive: false });
  ["touchend", "touchcancel"].forEach(ev => lb.addEventListener(ev, (e) => {
    if (e.touches.length < 2) lbPinch = null;
    if (e.touches.length === 0) { lbDrag = null; lbApply(true); }
  }));
}

function imgProxyUrl(u, ref) {
  const q = new URLSearchParams({ url: u, ref: ref || "", proxy: getProxy(), cookie: getCookieBrowser() });
  return "/api/image_proxy?" + q.toString();
}

/* 视频封面单独保存：经本地代理取图（绕过防盗链），再以原图文件名下载 */
function originalCoverUrl(u) {
  try {
    const url = new URL(u, location.href);
    if (/(^|\.)pbs\.twimg\.com$/.test(url.hostname)) {
      url.searchParams.set("name", "orig");   // X/Twitter 取未压缩原图
      return url.toString();
    }
    // YouTube：hq/mq/sd default 一律升级为 maxres（404 时调用方会回退原地址）
    if (/(^|\.)ytimg\.com$/.test(url.hostname)) {
      const m = /\/vi\/([^/]+)\//.exec(url.pathname);
      if (m) { url.pathname = "/vi/" + m[1] + "/maxresdefault.jpg"; url.search = ""; return url.toString(); }
    }
    // Bilibili：去掉 @xxxw_xxxh 缩放后缀，取原始尺寸
    if (/(^|\.)hdslb\.com$/.test(url.hostname)) {
      url.pathname = url.pathname.replace(/@.*$/, "");
      return url.toString();
    }
  } catch (_) {}
  return u;
}
// 解码图片 blob 测像素面积（测不出的返回 0，由调用方兜底）
async function imageBlobArea(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const area = bmp.width * bmp.height;
    if (bmp.close) bmp.close();
    return area;
  } catch (_) {
    return new Promise(resolve => {
      try {
        const u = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => { resolve(img.naturalWidth * img.naturalHeight); URL.revokeObjectURL(u); };
        img.onerror = () => { resolve(0); URL.revokeObjectURL(u); };
        img.src = u;
      } catch (_) { resolve(0); }
    });
  }
}

async function saveCover() {
  const info = lastInfo || {};
  if (!info.cover) return;
  if (savedState().cover) return;   // 已保存过，防止重复保存
  hideError();
  const btn = document.getElementById("coverBtn");
  let savedOk = false;
  btn.disabled = true; btn.textContent = t("cover_saving");
  try {
    // 候选：原图升级地址 + 后端给出的全部封面变体，逐个下载并实测像素，保存最大的
    const cands = [originalCoverUrl(info.cover)]
      .concat((info.covers || []).map(originalCoverUrl))
      .filter((v, i, a) => v && a.indexOf(v) === i)
      .slice(0, 6);
    let best = null, bestArea = 0, firstBlob = null;
    for (const u of cands) {
      try {
        const res = await fetch(imgProxyUrl(u, info.webpage));
        if (!res.ok) continue;
        const b = await res.blob();
        if (!b.size) continue;
        if (!firstBlob) firstBlob = b;
        const area = await imageBlobArea(b);
        if (area > bestArea) { bestArea = area; best = b; }
      } catch (_) {}
    }
    const blob = best || firstBlob;
    if (!blob) throw new Error("empty");
    const m = /\.(jpe?g|png|webp|gif|avif|bmp)(?:$|\?)/i.exec(info.cover.split("#")[0]);
    const byType = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "image/avif": "avif" };
    const ext = (m && m[1].toLowerCase().replace("jpeg", "jpg")) || byType[blob.type] || "jpg";
    const base = (info.title || "cover").replace(/[\\/:*?"<>|\r\n]/g, "_").trim().slice(0, 80) || "cover";
    // 统一保存到「下载地址」目录（与视频/图片/音乐同一位置），跨平台一致
    let saved = null;
    try {
      const fd = new FormData();
      fd.append("file", blob, base + "_封面." + ext);
      fd.append("title", base);
      fd.append("ext", ext);
      const r = await fetch("/api/save_cover", { method: "POST", body: fd });
      const d = await r.json();
      if (d.ok) saved = d;
    } catch (_) {}
    if (saved) {
      savedOk = true;                 // 按钮转为「已保存」并禁用，直到下一次解析
      showDlDirMsg(t("cover_saved_to") + saved.dir, true);
    } else {
      // 服务端保存失败时退回浏览器下载，保证用户至少能拿到文件
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = base + "_封面." + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  } catch (e) {
    showErrorSpec({ key: "cover_fail" });
  } finally {
    if (savedOk) {
      // 保持「已保存」并禁用，直到下一次解析，避免误点重复保存
      savedState().cover = 1;
      persistSaved();
    }
    updateCoverBtn();
  }
}

// 导出歌词为 .lrc 文件（带翻译时为双语对照），存到该标题的文件夹
async function saveLyrics() {
  const info = lastInfo || {};
  if (!info.lyrics) return;
  if (savedState().lyrics) return;
  const btn = document.getElementById("lyricsBtn");
  btn.disabled = true; btn.textContent = t("cover_saving");
  let savedOk = false;
  try {
    const res = await fetchRetry("/api/save_lyrics", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: info.title || "lyrics",
                             lyrics: info.lyrics, lyrics_trans: info.lyrics_trans || "" })
    });
    const data = await res.json();
    if (res.ok && data.ok) savedOk = true;
    else showErrorSpec({ data });
  } catch (e) {
    showErrorSpec({ key: "ERR_GENERIC" });
  } finally {
    if (savedOk) {
      savedState().lyrics = 1;
      persistSaved();
    }
    updateLyricsBtn();
  }
}

// ---------------- download & progress ----------------
const ICON_OK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_FAIL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

async function startDownload(kind) {
  if (!currentUrl) return;
  // 批量下载（漫画全话 / 影视全集）：确认后逐话/逐集下载，结果存 总文件夹/{话/集名}/
  let all = false;
  if (kind === "batch") {
    all = true;
    if (batchBusy) return;   // 已在批量下载中，防止重复触发
    const isMangaImg = lastInfo && lastInfo.content_type === "image";
    const eps = (lastInfo && Array.isArray(lastInfo.episodes)) ? lastInfo.episodes : [];
    if (!eps.length) return;
    const msg = isMangaImg ? t("batch_confirm") : t("batch_confirm_ep");
    if (!confirm(msg.replace("{n}", eps.length))) return;
    kind = isMangaImg ? "images" : "video";
    batchBusy = true;        // 按钮转为「下载中…」禁用态
    updateEpAllBtn();
  }
  // 同一配置（视频含分辨率）下载过就不重复下载（批量下载不查重，随时可再来一轮）
  const st = savedState();
  if (!all && kind === "video" && st.video === requestedVideoHeight()) return;
  if (!all && kind !== "video" && st[kind]) return;
  hideError();
  // 选最高档时传 0（= 平台最佳），避免档位标签取整（如 1600P 被标 2K）把画质卡低
  const height = kind === "video" ? requestedVideoHeight() : 0;
  try {
    const res = await fetchRetry("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: currentUrl, kind, height, proxy: getProxy(), cookie_browser: getCookieBrowser(), play_url: selectedEpisodeUrl, all })
    });
    const data = await res.json();
    if (!res.ok) {
      showErrorSpec({ data });
      if (String(data.code || "").startsWith("SPH_")) showSphPanel(true);
      if (all) { batchBusy = false; updateEpAllBtn(); }   // 下单失败，按钮复位
      return;
    }
    pollProgress(data.task_id, kind, height, all);
  } catch (e) {
    if (all) { batchBusy = false; updateEpAllBtn(); }
    showErrorSpec({ key: "err_net" });
  }
}

function pollProgress(taskId, kind, dlHeight, all) {
  progressState = { taskId, kind, all: !!all, phase: "running", pct: 0, speed: "", eta: 0,
                    status: "downloading", startedAt: Date.now() };
  renderProgress();
  document.getElementById("progressBox").scrollIntoView({ behavior: "smooth", block: "nearest" });

  clearInterval(pollTimer);
  let pollMisses = 0;   // 连接失败的连续次数：开发模式重启会短暂失联，容忍几秒；真断了才报错
  pollTimer = setInterval(async () => {
    let s;
    try {
      const res = await fetch("/api/progress/" + taskId);
      s = await res.json();
      pollMisses = 0;
    } catch (e) {
      // 任务在服务端内存里，服务重启后任务已丢失，重试无意义
      if (++pollMisses >= 6) {
        clearInterval(pollTimer);
        progressState = { taskId, kind, all: !!all, phase: "error", errorData: { error: t("poll_lost") } };
        if (all) { batchBusy = false; updateEpAllBtn(); }   // 任务丢失，按钮复位
        renderProgress();
      }
      return;
    }
    if (s.error) {
      clearInterval(pollTimer);
      progressState = { taskId, kind, all: !!all, phase: "error", errorData: s };
      if (all) { batchBusy = false; updateEpAllBtn(); }
      renderProgress();
      return;
    }
    if (!progressState) return;
    progressState.pct = s.progress || 0;
    progressState.speed = s.speed || "";
    progressState.eta = s.eta || 0;
    progressState.count = s.count || "";
    progressState.episode = s.episode || "";
    // 批量结果明细（成功/跳过/失败 + 失败清单），完成卡里分开说清楚
    progressState.okCount = s.ok_count;
    progressState.skipCount = s.skip_count;
    progressState.failCount = s.fail_count;
    progressState.totalCount = s.total_count;
    progressState.failed = Array.isArray(s.failed) ? s.failed : [];
    progressState.status = s.status;
    if (s.status === "done") {
      clearInterval(pollTimer);
      progressState.phase = "done";
      progressState.filename = s.filename;
      // 对应按钮转为「已保存」，防止误点重复下载（视频按档位记录）
      // 批量下载单独记录 all：不锁定单个下载按钮，只锁定批量按钮
      if (all) {
        savedState().all = 1;
        batchBusy = false;
      } else {
        savedState()[kind] = (kind === "video") ? (typeof dlHeight === "number" ? dlHeight : requestedVideoHeight()) : 1;
      }
      persistSaved();
      updateDlBtns();
    } else if (s.status === "error") {
      clearInterval(pollTimer);
      progressState.phase = "error";
      progressState.errorData = s;
      if (all) { batchBusy = false; updateEpAllBtn(); }
    }
    renderProgress();
  }, 800);
}

function fmtEta(sec) {
  const n = Number(sec) || 0;
  if (n >= 60) return lang === "zh" ? `${Math.floor(n / 60)} 分 ${n % 60} 秒` : `${Math.floor(n / 60)}m ${n % 60}s`;
  return lang === "zh" ? `${n} 秒` : `${n}s`;
}

// 已用时：每秒跳动的本地计时（即使百分比/速度长期不变也看得出在走）
function fmtElapsed(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}:${String(s).padStart(2, "0")}` : `${s}s`;
}

function renderProgress() {
  const box = document.getElementById("progressBox");
  const card = document.getElementById("progressCard");
  const s = progressState;
  if (!s) { box.style.display = "none"; card.innerHTML = ""; return; }
  box.style.display = "block";
  if (s.phase === "running") {
    let title = t("prog_dl");
    if (s.kind === "audio") title = t("prog_audio");
    else if (s.kind === "music") title = t("prog_music");
    else if (s.kind === "images") title = t("prog_img");
    if (s.status === "processing" && s.kind !== "images") title = t("prog_merge");
    // 批量下载：count 是「N/M 话/集」，附带当前下载的话/集名 + 已用时（本地计时）
    const elapsed = s.startedAt ? Math.max(0, Math.floor((Date.now() - s.startedAt) / 1000)) : 0;
    const meta1 = [s.speed, s.count && s.count, s.episode,
                   elapsed > 0 && t("elapsed") + fmtElapsed(elapsed)].filter(Boolean).join(" · ");
    card.innerHTML = `
      <div class="progress-head"><span>${title}</span><span>${s.pct || 0}%</span></div>
      <div class="bar"><div class="bar-fill" style="width:${s.pct || 0}%"></div></div>
      <div class="progress-meta"><span>${meta1}</span><span>${s.eta ? t("eta_prefix") + fmtEta(s.eta) : ""}</span></div>`;
  } else if (s.phase === "done") {
    // 批量任务把「成功 / 跳过 / 失败」分开写清楚，不再让人猜「3/15 话」是什么意思
    let meta = "";
    if (s.all && typeof s.okCount === "number") {
      const isCh = s.kind !== "video";
      const parts = [t(isCh ? "res_ok" : "res_ok_ep")(s.okCount)];
      if (s.skipCount) parts.push(t(isCh ? "res_skip" : "res_skip_ep")(s.skipCount));
      if (s.failCount) parts.push(t(isCh ? "res_fail" : "res_fail_ep")(s.failCount));
      meta = parts.join(" · ");
      if (s.failCount && s.failed && s.failed.length) {
        const names = s.failed.slice(0, 4).join("、") + (s.failed.length > 4 ? "…" : "");
        meta += `<span class="done-list">${t("res_failed_list")}${names}</span>`;
      }
    }
    card.innerHTML = `
      <div class="done-box">
        <div class="done-icon">${ICON_OK}</div>
        <p>${s.filename || t("ready")}${meta ? "" : (s.count ? "（" + s.count + "）" : "")}</p>
        ${meta ? `<p class="done-meta">${meta}</p>` : ""}
        <button class="btn" onclick="revealFile('${s.taskId}')">${t("save_btn")}</button>
      </div>`;
  } else {
    const msg = s.errorData ? localizeError(s.errorData) : (s.errorText || "");
    card.innerHTML = `<div class="done-box"><div class="done-icon">${ICON_FAIL}</div><p>${t("dl_fail")}${msg}</p></div>`;
  }
}

// 打开系统文件管理器并选中已完成文件（文件已在下载地址里，不重复下载）
async function revealFile(taskId) {
  try {
    const r = await fetch("/api/reveal_file", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: taskId })
    });
    const d = await r.json();
    if (!d.ok) alert(t("reveal_fail") + (d.error || ""));
  } catch (e) {
    alert(t("reveal_fail") + e);
  }
}
